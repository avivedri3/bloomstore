name: 🚀 Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  NX_CLOUD_DISTRIBUTED_EXECUTION: "false"
  NX_CLOUD_NO_ACCESS: "true"
  NX_SKIP_CLOUD_CACHE: "true"

jobs:
  build:
    name: 🏗️ Build Frontend & Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🏷️ Set build metadata
        id: build-meta
        run: |
          echo "build_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"
          APP_VERSION="$(node -p "require('./package.json').version")"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"

      - name: 🔧 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: 🔍 Cache Nx computation cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-

      - name: 🧭 Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 🏷️ Normalize Vite base path
        id: base
        run: |
          BASE="${{ steps.pages.outputs.base_path }}"
          BASE="${BASE:-/${GITHUB_REPOSITORY#*/}}"
          [[ "$BASE" == */ ]] || BASE="${BASE}/"
          echo "vite_base_url=$BASE" >> "$GITHUB_OUTPUT"
          echo "Vite base URL: $BASE"

      - name: 🏗️ Build frontend for production
        run: npm exec nx -- build @bloomstore/frontend --configuration=production --no-cloud
        env:
          BUILD_DATE: ${{ steps.build-meta.outputs.build_date }}
          APP_VERSION: ${{ steps.build-meta.outputs.app_version }}
          VITE_BASE_URL: ${{ steps.base.outputs.vite_base_url }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_ENVIRONMENT: production
          NODE_ENV: production

      - name: 📚 Convert project book to HTML
        run: |
          mkdir -p dist/apps/frontend/docs
          python3 - <<'PY'
          from pathlib import Path
          import html
          md = Path("docs/project-book.md").read_text(encoding="utf-8")
          escaped = html.escape(md)
          page = f"""<!DOCTYPE html>
          <html lang="he" dir="rtl">
          <head>
            <meta charset="utf-8"/>
            <title>ספר פרויקט BloomStore</title>
            <style>
              body {{ font-family: 'Segoe UI', Arial, sans-serif; max-width: 920px; margin: 2rem auto; line-height: 1.7; }}
              pre {{ white-space: pre-wrap; }}
            </style>
          </head>
          <body>
            <h1>ספר פרויקט — BloomStore</h1>
            <p><a href="../">חזרה לחנות</a></p>
            <pre>{escaped}</pre>
          </body>
          </html>"""
          Path("dist/apps/frontend/docs/index.html").write_text(page, encoding="utf-8")
          PY

      - name: 📊 Verify build output
        run: |
          test -f dist/apps/frontend/index.html
          test -f dist/apps/frontend/docs/index.html
          echo "📊 Frontend build size: $(du -sh dist/apps/frontend)"
          ls -la dist/apps/frontend

      - name: 🔧 Prepare deployment files
        run: |
          cd dist/apps/frontend
          touch .nojekyll
          cp index.html 404.html
          printf 'User-agent: *\nAllow: /\n' > robots.txt

      - name: 📤 Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/apps/frontend
          include-hidden-files: true

  deploy:
    name: 🚀 Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 📋 Deployment summary
        run: |
          echo "✅ Frontend deployed successfully"
          echo "🌐 URL: ${{ steps.deployment.outputs.page_url }}"
          echo "📝 Commit: ${{ github.sha }}"
