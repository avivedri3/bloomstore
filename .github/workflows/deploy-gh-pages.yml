name: 🚀 Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pipeline
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  NX_CLOUD_DISTRIBUTED_EXECUTION: "false"
  NX_CLOUD_NO_ACCESS: "true"
  NX_SKIP_CLOUD_CACHE: "true"

jobs:
  deploy:
    name: 🚀 Deploy Frontend & Docs to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 🧭 Set Nx affected SHAs
        uses: nrwl/nx-set-shas@v4
      - name: 🏷️ Set build metadata
        id: build-meta
        run: |
          echo "build_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"
          APP_VERSION="$(node -p "require('./package.json').version")"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "repo_name=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
      - name: 🔧 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: 📦 Install dependencies
        run: npm ci --prefer-offline --no-audit --production=false
      - name: 🔍 Cache Nx computation cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-
      - name: 🏗️ Build frontend for production
        run: npm exec nx -- build @bloomstore/frontend --configuration=production --no-cloud
        env:
          BUILD_DATE: ${{ steps.build-meta.outputs.build_date }}
          APP_VERSION: ${{ steps.build-meta.outputs.app_version }}
          VITE_BASE_URL: /${{ steps.build-meta.outputs.repo_name }}/
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_ENVIRONMENT: production
          NODE_ENV: production
      - name: 📚 Convert project book to HTML
        run: |
          mkdir -p dist/apps/frontend/docs
          python3 - <<'PY'
          from pathlib import Path
          import html
          md = Path("docs/project-book.md").read_text(encoding="utf-8")
          escaped = html.escape(md)
          page = f"""<!DOCTYPE html>
          <html lang="he" dir="rtl">
          <head>
            <meta charset="utf-8"/>
            <title>ספר פרויקט BloomStore</title>
            <style>
              body {{ font-family: 'Segoe UI', Arial, sans-serif; max-width: 920px; margin: 2rem auto; line-height: 1.7; }}
              pre {{ white-space: pre-wrap; }}
            </style>
          </head>
          <body>
            <h1>ספר פרויקט — BloomStore</h1>
            <p><a href="../">חזרה לחנות</a></p>
            <pre>{escaped}</pre>
          </body>
          </html>"""
          Path("dist/apps/frontend/docs/index.html").write_text(page, encoding="utf-8")
          PY
      - name: 📊 Verify build output
        run: |
          test -f dist/apps/frontend/index.html
          test -f dist/apps/frontend/docs/index.html
      - name: 🔧 Prepare deployment files
        run: |
          cd dist/apps/frontend
          touch .nojekyll
          REPO="${{ steps.build-meta.outputs.repo_name }}"
          cat > robots.txt << EOF
          User-agent: *
          Allow: /
          EOF
          cat > 404.html << EOF
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Redirecting...</title>
            <script>window.location.href='/${REPO}/';</script>
          </head>
          <body>
            <p>Redirecting to <a href="/${REPO}/">BloomStore</a>...</p>
          </body>
          </html>
          EOF
      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/apps/frontend
